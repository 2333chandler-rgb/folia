name: Check upstream

on:
  schedule:
    # 每天北京时间 09:00 (UTC 01:00)
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream latest commit
        run: curl -s "https://api.github.com/repos/chthollyphile/folia-major/commits?per_page=1" | grep -E '"sha"|"date"|"message"' | head -6
